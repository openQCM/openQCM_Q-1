<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170" role="img" aria-label="Q-1 firmware update in five steps: stop and save data, check firmware version, launch the loader, program the verified HEX, reconnect and verify">
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5F7386"/></marker></defs>
<rect width="1000" height="170" fill="white"/>
<rect x="8.0" y="8" width="176" height="118" rx="6" fill="#F3F7FA" stroke="#9BACBA" stroke-width="1.5"/>
<text x="96.0" y="42" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#245D86" font-weight="bold" text-anchor="middle">
<tspan x="96.0" dy="0">1</tspan>
</text>
<text x="96.0" y="78" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#24313F" font-weight="normal" text-anchor="middle">
<tspan x="96.0" dy="0">Stop and</tspan>
<tspan x="96.0" dy="25">save data</tspan>
</text>
<path d="M 185.0 67 H 207.0" fill="none" stroke="#5F7386" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="210.0" y="8" width="176" height="118" rx="6" fill="#F3F7FA" stroke="#9BACBA" stroke-width="1.5"/>
<text x="298.0" y="42" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#245D86" font-weight="bold" text-anchor="middle">
<tspan x="298.0" dy="0">2</tspan>
</text>
<text x="298.0" y="78" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#24313F" font-weight="normal" text-anchor="middle">
<tspan x="298.0" dy="0">Check Firmware</tspan>
<tspan x="298.0" dy="25">Version</tspan>
</text>
<path d="M 387.0 67 H 409.0" fill="none" stroke="#5F7386" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="412.0" y="8" width="176" height="118" rx="6" fill="#F3F7FA" stroke="#9BACBA" stroke-width="1.5"/>
<text x="500.0" y="42" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#245D86" font-weight="bold" text-anchor="middle">
<tspan x="500.0" dy="0">3</tspan>
</text>
<text x="500.0" y="78" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#24313F" font-weight="normal" text-anchor="middle">
<tspan x="500.0" dy="0">Launch the</tspan>
<tspan x="500.0" dy="25">loader</tspan>
</text>
<path d="M 589.0 67 H 611.0" fill="none" stroke="#5F7386" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="614.0" y="8" width="176" height="118" rx="6" fill="#F3F7FA" stroke="#9BACBA" stroke-width="1.5"/>
<text x="702.0" y="42" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#245D86" font-weight="bold" text-anchor="middle">
<tspan x="702.0" dy="0">4</tspan>
</text>
<text x="702.0" y="78" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#24313F" font-weight="normal" text-anchor="middle">
<tspan x="702.0" dy="0">Program the</tspan>
<tspan x="702.0" dy="25">verified HEX</tspan>
</text>
<path d="M 791.0 67 H 813.0" fill="none" stroke="#5F7386" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#arrow)"/>
<rect x="816.0" y="8" width="176" height="118" rx="6" fill="#F3F7FA" stroke="#9BACBA" stroke-width="1.5"/>
<text x="904.0" y="42" font-family="DejaVu Sans, sans-serif" font-size="23" fill="#245D86" font-weight="bold" text-anchor="middle">
<tspan x="904.0" dy="0">5</tspan>
</text>
<text x="904.0" y="78" font-family="DejaVu Sans, sans-serif" font-size="20" fill="#24313F" font-weight="normal" text-anchor="middle">
<tspan x="904.0" dy="0">Reconnect</tspan>
<tspan x="904.0" dy="25">and verify</tspan>
</text>
<text x="500.0" y="158" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#5F7386" font-weight="normal" text-anchor="middle">
<tspan x="500.0" dy="0">A 2.2 reply does not identify the build. The app only launches the loader.</tspan>
</text>
</svg>